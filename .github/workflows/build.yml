name: Build DailyNews

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          gradle --no-daemon assembleDebug -PNEWS_API_KEY="$NEWS_API_KEY"

            - name: Get Debug Keystore SHA
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyNews-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
